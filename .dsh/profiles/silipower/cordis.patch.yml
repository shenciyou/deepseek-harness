# Silipower profile patch layer. dsh-base + dsh-web-app already compose the LLM
# (DeepSeek), API gateway, webserver, skill, web-search, settings, and
# credentials plugins. This layer adds SQLite domain persistence and the
# silipower business plugin on top.

- insert:
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('silipower.sqlite')

    - id: silipower
      name: '@silipower/dsh-silipower'

# The web-app bundle already mounts storage-domain with the json backend; route
# it onto the sqlite backend registered above.
- id: storage-domain
  config:
    backend: sqlite

# Full-text session search stays opt-in in the web bundle. Turn it on with a
# durable derived index so the silipower knowledge surface can query it.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

# The web bundle disables the host filesystem skill provider because agent
# presets own local discovery. Re-enable it only for Silipower's business
# skills, pointed at the packaged skill content next to this plugin.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.cwd() + '/packages/silipower/skill-content'
